secretsNames:
  # EIP-712 attester key (must be AirlockReceiver.attester()); it signs every Clear and Veto report.
  # In simulation the value comes from this env var (scripts read it from a key file outside the repo).
  # This file only ever holds names, never values.
  VETO_ATTESTER_KEY:
    - VETO_ATTESTER_KEY_ALL
