# CRE project settings (RPCs per target). chain-name values come from chain-selectors.
# http:// is accepted by the CLI only for loopback hosts (anvil).
sepolia-fork:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: http://127.0.0.1:${VETO_ANVIL_PORT}

sepolia:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
